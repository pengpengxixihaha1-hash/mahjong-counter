name: iOS 云构建

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 检查 Xcode 版本
        run: xcodebuild -version

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        working-directory: ios
        run: xcodegen generate

      - name: 编译（不签名，iPhone 真机）
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project WeiLePoker50K.xcodeproj \
            -scheme WeiLePoker50K \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            2>&1 | tail -60

      - name: 打包未签名 ipa
        working-directory: ios
        run: |
          APP="build/Build/Products/Release-iphoneos/WeiLePoker50K.app"
          test -d "$APP" || { echo "App 未生成"; exit 1; }
          rm -rf Payload WeiLePoker50K-unsigned.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry WeiLePoker50K-unsigned.ipa Payload
          ls -lh WeiLePoker50K-unsigned.ipa

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: WeiLePoker50K-unsigned-ipa
          path: ios/WeiLePoker50K-unsigned.ipa
          retention-days: 30
