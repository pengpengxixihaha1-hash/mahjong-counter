name: Build IPA
on: push
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build
        run: |
          xcodebuild -project MahjongCounter.xcodeproj -scheme MahjongCounter -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" build | tail -30
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/MahjongCounter.app Payload/
          zip -qry MahjongCounter.ipa Payload
          ls -la MahjongCounter.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: MahjongCounter-ipa
          path: MahjongCounter.ipa
