name: MahjongCounter
options:
  bundleIdPrefix: com.mahjongcounter
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  MahjongCounter:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - target: BroadcastCapture
        embed: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 五十K记牌器
        CFBundleShortVersionString: "3.0"
        CFBundleVersion: "3"
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
    entitlements:
      path: App/MahjongCounter.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.mahjongcounter.shared
  BroadcastCapture:
    type: broadcast-extension
    platform: iOS
    sources:
      - path: Broadcast
      - path: Shared
    info:
      path: Broadcast/Info.plist
      properties:
        CFBundleDisplayName: 五十K识别
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).SampleHandler"
    entitlements:
      path: Broadcast/BroadcastCapture.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.mahjongcounter.shared
schemes:
  MahjongCounter:
    build:
      targets:
        MahjongCounter: all
        BroadcastCapture: all
